name: proba
on: push
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - run: pip install nbconvert ipykernel
      - run: python -m nbconvert --to markdown --execute liczenie_w_c_za_pomoca_pythona.ipynb
      - uses: actions/upload-artifact@v4
        with:
          path: liczenie_w_c_za_pomoca_pythona.md
            
